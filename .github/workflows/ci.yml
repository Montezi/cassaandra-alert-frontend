name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual redeploy of main without a new commit: Actions tab -> CI -> "Run workflow".
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel outdated PR runs, never a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Needed to request the OIDC token used by google-github-actions/auth.
  id-token: write

jobs:
  check:
    name: Lint, typecheck, build (and deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Every push to main (e.g. a merged PR) deploys, after the checks above pass.
      # Deploy without any stored key: GitHub proves who it is with a short-lived
      # OIDC token, and Google lets this repository (and only it) act as the
      # github-deploy service account (Workload Identity Federation, ADR-010).
      - name: Authenticate to Google Cloud
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/41740695959/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@cassaandra-alert.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        # Exact version, so a deploy never pulls in a release nobody reviewed.
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project cassaandra-alert --non-interactive
