name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual redeploy of main without a new commit: Actions tab -> CI -> "Run workflow".
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel outdated PR runs, never a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build (and deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Every push to main (e.g. a merged PR) deploys, after the checks above pass.
      - name: Deploy to Firebase Hosting
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # JSON key of a service account with the roles Firebase Hosting Admin,
          # Cloud Run Viewer (needed by the /api rewrites) and API Keys Viewer,
          # stored as the FIREBASE_SERVICE_ACCOUNT repository secret. Never commit it.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: cassaandra-alert
          channelId: live
